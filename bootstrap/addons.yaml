apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-helm-hefesto
  namespace: argocd
spec:
  generators:
  - git:
      repoURL: https://github.com/FelipeVerbanek/repasse-2026.git
      revision: master
      directories:
      - path: "addons/helmcharts/*/*"
  template:
    metadata:
      name: '{{path.basename}}-{{path[0]}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/FelipeVerbanek/repasse-2026.git
        targetRevision: master
        path: '{{path}}'
        helm:
          valueFiles:
          - values.yaml
      destination:
        name: "https://10.89.0.3:6443"
        namespace: '{{path[2]}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
